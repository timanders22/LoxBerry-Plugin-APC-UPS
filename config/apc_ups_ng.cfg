; APC-UPS NG
; Wird von der Plugin-Oberflaeche geschrieben.
;
; Diese Datei liegt dem Paket bei, damit die Voreinstellungen von Anfang an
; feststehen. Die Reihenfolge und die Namen muessen zu VORGABEN in
; bin/apc_common.py und zu ap_defaults() in ap_lib.php passen; der Reiter
; Test haelt die beiden Listen gegeneinander.
;
; ACHTUNG beim Aendern: postinstall.sh traegt die Pruefsumme genau dieser
; Datei (AP_VORGABE_SUMMEN, seit 1.2.23 eine Liste: die neue Summe vorn, die
; der Vorfassungen dahinter), um zu erkennen, ob der Installer die
; Einstellungen des Nutzers ueberschrieben hat. Wer hier etwas aendert, muss
; die neue Summe dort voranstellen - sonst gilt jede frisch installierte Datei
; als "vom Nutzer bearbeitet", und die Zweitschrift wird nicht mehr
; zurueckgespielt.

[apc_ups_ng]
enabled=1
intervall=30
aktualisierung=300
themenpraefix=apcups
mqtt=1
benachrichtigung=1
email=0
email_an=root
host=
; --- neu in 1.2.0 ---
; Vorwarnung fuer alarm_level: wie weit vor der Abschaltschwelle von apcupsd
; die Stufe 2 gemeldet wird.
vorwarn_min=5
vorwarn_prozent=10
; Zusaetzliche Rohfelder von apcaccess, kommagetrennt. AB WERK LEER - eine
; neue Funktion schaltet sich nicht selbst ein.
rohfelder=
; Obergrenze der Protokolldatei in Kilobyte. log/plugins liegt auf einer
; Ramdisk.
log_kb=512
; --- neu in 1.2.23 ---
; Lese-Endpunkt fuer Loxone (alter XML-Weg) annehmen? Neuinstallation aus; ein
; Update setzt bei bestehenden Anlagen 1 (postupgrade.sh), damit nichts bricht.
endpunkt_ein=0
; Sprachausgabe bei Stromausfall (gemeinsames Sprachmodul). AB WERK AUS.
tts_mode=aus
tts_ip=
tts_port=7091
tts_zones=1
tts_volume=8
tts_lang=de
tts_template=
tts_alexa_geraet=
tts_alexa_token=
tts_alexa_laut=-1
tts_google_geraet=
tts_google_token=
tts_google_laut=-1
tts_sonos_zone=
tts_sonos_laut=-1
tts_sonox_raum=
tts_sonox_laut=-1
tts_sonox_sprache=de
tts_ziele=
; Welche Anlaesse angesagt werden (wirken nur mit einer Ausgabeart) und die
; Sperrzeit je Anlass in Sekunden.
ansage_ausfall=1
ansage_rueckkehr=1
ansage_vorwarnung=1
ansage_abschaltung=1
ansage_sperre=600
; Stufe an andere Plugins geben (haus/usv/stufe, Regeln/07 Nr. 15). AB WERK AUS.
haus_usv_ein=0
; Merkmal gegen fremde Absender. Entsteht beim ersten Aufruf der Oberflaeche.
formtoken=
