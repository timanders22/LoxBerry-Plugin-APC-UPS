; APC-UPS NG
; Wird von der Plugin-Oberflaeche geschrieben.
;
; Diese Datei liegt dem Paket bei, damit die Voreinstellungen von Anfang an
; feststehen. Die Reihenfolge und die Namen muessen zu VORGABEN in
; bin/apc_common.py und zu ap_defaults() in ap_lib.php passen; der Reiter
; Test haelt die beiden Listen gegeneinander.
;
; ACHTUNG beim Aendern: postinstall.sh traegt die Pruefsumme genau dieser
; Datei, um zu erkennen, ob der Installer die Einstellungen des Nutzers
; ueberschrieben hat. Wer hier etwas aendert, muss die Pruefsumme dort
; mitziehen - sonst gilt jede frisch installierte Datei als "vom Nutzer
; bearbeitet", und die Zweitschrift wird nicht mehr zurueckgespielt.

[apc_ups_ng]
enabled=1
intervall=30
aktualisierung=300
themenpraefix=apcups
mqtt=1
benachrichtigung=1
email=0
email_an=root
host=
; --- neu in 1.2.0 ---
; Vorwarnung fuer alarm_level: wie weit vor der Abschaltschwelle von apcupsd
; die Stufe 2 gemeldet wird.
vorwarn_min=5
vorwarn_prozent=10
; Zusaetzliche Rohfelder von apcaccess, kommagetrennt. AB WERK LEER - eine
; neue Funktion schaltet sich nicht selbst ein.
rohfelder=
; Obergrenze der Protokolldatei in Kilobyte. log/plugins liegt auf einer
; Ramdisk.
log_kb=512
; Merkmal gegen fremde Absender. Entsteht beim ersten Aufruf der Oberflaeche.
formtoken=
