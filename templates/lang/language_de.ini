SPRACHE_HINWEIS="Zwei Kleinbuchstaben nach ISO 639-1, z. B. de, en, fr, it, es, nl. Das Modul prüft nur die Form; welche Sprachen der Music Server bzw. die Adressvorlage wirklich spricht, entscheidet das Gerät. Gilt auch für weitere Ziele mit leerer Sprache."
P_ZIEL_SPRACHE="z. B. de, en, fr – leer = wie Ziel 1"
P_ZIEL_SPRACHE_SONOX="z. B. de, en-gb – leer = wie Ziel 1"
P_ZIEL_SPRACHE_GERAET="– (Sprache des Geräts)"
ZIEL_SPRACHE_HINWEIS="Sprache: bei Music Server und Adressvorlage zwei Kleinbuchstaben nach ISO 639-1, z. B. de, en, fr, it, es, nl; bei Sonos (SonoX) auch mit Land, z. B. de-at, en-gb; leer = wie Ziel 1. Das Modul prüft nur die Form. Amazon Echo, Google-Lautsprecher und Sonos (Sonos4Lox) sprechen in der Sprache des Geräts – dort ist das Feld gesperrt; ein Eintrag (nach einem Wechsel der Art) wird beim Speichern verworfen."
K_ZIEL_SPRACHE_GERAET="Ziel %s: %s spricht in der Sprache des Geräts – das Feld Sprache gilt hier nicht, der Eintrag wurde verworfen."
R_HINWEIS="Die Ansagen sind ab Werk an. Ausschalten: oben bei der Ausgabeart „aus“ wählen und speichern; das bleibt auch nach einem Update aus. Ein Ziel, das noch nicht eingerichtet ist, wird übergangen."
L_R_ANLAESSE="Das wird angesagt"
R_ANLAESSE_HINWEIS="Eigene Haken, getrennt von den Benachrichtigungen: Ein Ereignis lässt sich lesen, ohne es zu hören."
L_R_NACHTRUHE="Nachtruhe einhalten"
R_NACHT_HINWEIS="In der Nachtruhe entfällt eine Ansage und wird nicht nachgeholt; sie steht im Protokoll. Dringendes spricht trotzdem."
L_R_VON="Nachtruhe von"
L_R_BIS="Nachtruhe bis"
L_R_SPERRE="Dieselbe Ansage höchstens einmal in (Minuten)"
R_SPERRE_HINWEIS="5 bis 240 Minuten, je Ereignis und Gerät."
R_SCHALTER_HINWEIS="Alle Plugins schweigen, solange Loxone das MQTT-Thema %s retained auf 1 setzt (Schalter „Ansagen aus“). Das gilt auch für Dringendes. Die Testansage spricht immer."
TOKEN_VOR_ORT_HINWEIS="Leer lassen genügt, wenn Alexa-NG oder Chromecast4lox auf diesem LoxBerry laufen: Das Sprechtoken wird dort gelesen, hier gespeichert und nachgezogen, wenn es sich dort ändert. Ein von Hand eingetragenes Token bleibt, wie es ist. In Sicherungen steht es nie."
M_R_BLOCK="Die Regeln der Ansagen sind nicht lesbar."
