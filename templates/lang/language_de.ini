RETAIN_ERKLAERUNG = "<b>Retained heißt:</b> der Broker merkt sich den letzten Wert und gibt ihn jedem neuen Abnehmer sofort. Das ist für Zustände richtig — Modell, Seriennummer, ob die USV am Netz hängt. Für Messwerte wäre es schädlich: wer sich nach einer Stunde neu verbindet, bekäme eine stundenalte Restlaufzeit serviert und hielte sie für aktuell. Deshalb ist nur ein Teil der Themen retained; die Spalte oben sagt für jedes einzelne, welcher. Wie frisch ein Wert ist, sagt <span class='sm-mono'>timestamp</span>."
