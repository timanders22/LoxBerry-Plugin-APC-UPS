[LOXONE]
SCHRITT1 = "Schritt 1: Weg festlegen"
SCHRITT1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt ein passend benannter virtueller Eingang. Der alte XML-Weg bleibt für bestehende Anlagen erhalten und ist weiter unten beschrieben. Zuerst im Reiter <b>Test</b> mit <i>Jetzt abfragen</i> prüfen, ob die USV überhaupt antwortet — kommen dort Werte, ist der schwierige Teil erledigt."
SCHRITT2 = "Schritt 2: Das Abo im MQTT-Gateway"
SCHRITT2_TEXT = "Die Themengruppe dieses Plugins lautet:"
SCHRITT3 = "Schritt 3: Virtuelle Eingänge anlegen"
SCHRITT3_TEXT = "Seit 1.2.23 ohne Vorlage: je Wert ein Virtueller Eingang mit genau dem Namen, den das MQTT-Gateway vergibt. Die Tabelle nennt alle Namen, die Bauform, den Bereich mit Fehlwert und die Stelle auf den Musterseiten."
KNOPF_XML = "Vorlage für den alten XML-Weg erzeugen"
PRAEFIX_SCHRAEG = "Ihr Themenpräfix „%s“ enthält einen Schrägstrich. In Loxone steht dafür ein Unterstrich, so wie das MQTT-Gateway die Eingänge benennt: %s statt %s. Vorlage und Baustein-Listen auf dieser Seite verwenden schon diese Namen."
IMPORT_DOPPELT = "Loxone Config legt beim Import neu an und überschreibt nichts. Zweimal importiert heißt doppelte Objekte."
SCHRITT4 = "Schritt 4: Befehle"
SCHRITT4_TEXT = "Befehle: keine – das Plugin liest nur. Die Abschaltung macht apcupsd selbst (siehe Reiter Einstellungen, Abschnitt Notabschaltung). Es gibt deshalb keinen virtuellen Ausgang."
SCHRITT5 = "Schritt 5: Ausfallerkennung"
SCHRITT5_TEXT = "Ein virtueller Eingang behält seinen letzten Wert, wenn nichts mehr kommt. Dagegen: <span class='sm-mono'>status/zaehler</span> zählt bei jedem Lauf des Dienstes eins weiter (0 bis 999, auch bei ausgeschaltetem Plugin) – eine Analogwertvalidierung mit Tmc = fünfmal der Abfragetakt (ab Werk 150 s) meldet, wenn er stehen bleibt; den Haken bei ‚En‘ im Eigenschaftsfenster entfernen. <span class='sm-mono'>status/ok</span> (1 gelungen, 0 gescheitert oder ausgeschaltet, -1 noch keine Abfrage) und <span class='sm-mono'>service/online</span> (0 setzt der Broker selbst, wenn der Dienst abstürzt) unter Gateway V2 auf „Noncached“ stellen. <span class='sm-mono'>status/ts</span> und <span class='sm-mono'>timestamp</span> nicht für eine Altersrechnung verwenden (Ortszeit)."
SCHRITT6 = "Schritt 6: Zwei komplette Baustein-Listen zum Nachbauen"
BAUSTEINE_VORTEXT = "Zwei Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein (Baustein-Suche in Loxone Config: Taste <b>F5</b>). Die erste zeigt Stromausfall, Vorwarnung und Abschaltung, meldet Störungen der Abfrage und wirft bei knappem Akku Verbraucher ab – sie genügt für den Anfang. Die zweite zeigt Akku, Netz, Last und Gerätedaten und meldet Überlast, Wärme, einen Akku, der nicht lädt, und ein unruhiges Netz. Die Eingänge sind Virtuelle Eingänge und Texteingänge mit dem Namen, den das MQTT-Gateway vergibt (Schritt 3) – die Namen bleiben, wie sie sind."
SP_BAUSTEIN = "Baustein (Typ)"
