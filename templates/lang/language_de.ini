BL_S1 = "Zustand, Störung und Stromausfall"
BL_S2 = "Akku, Netz und Last"
S1_SCHRITT1 = "apcupsd muss laufen und die USV sehen. Im Plugin Reiter „%s“ → „%s“: kommen Werte, ist der schwierige Teil erledigt. Im Reiter „%s“ „%s“ setzen, die Vorwarnung prüfen (ab Werk 5 Minuten bzw. 10 Prozentpunkte über der Abschaltschwelle) und speichern."
S1_SCHRITT2 = "LoxBerry → MQTT Gateway: das Abo %s trägt das Plugin selbst ein (Schritt 2 oben sagt, was bei Ihrem Gateway gilt). Gateway V2: unter %s die Datenpunkte anhaken, auch status, event und last_error."
S1_SCHRITT3 = "Oben in diesem Reiter (Schritt 3) „%s“ drücken. In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren → %s. Nur EINMAL einlesen (zweimal ergibt doppelte Bausteine). Die Vorlage für den alten XML-Weg NICHT dazu einlesen – sie liefert fünf der Werte ein zweites Mal."
S1_SCHRITT4 = "Drei Virtuelle Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s, %s, %s; „In Visualisierung verwenden“ an. So benennt das MQTT-Gateway die Werte (mit dem Themenpräfix aus dem Reiter MQTT) – ein anderer Name bekommt nie einen Wert."
S1_SCHRITT5 = "Seite „APC-UPS NG“ anlegen. Aus „%s“ ziehen: %s; dazu die drei Texteingänge und die Konstante 1."
S1_SCHRITT6 = "Fünf Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „USV-Meldung“, „USV Akku tauschen“, „USV Netz wieder da“, „USV Akku bald leer“, „USV Abschaltung“, Texte wie in der Liste, und auf die Seite ziehen. Jede bekommt genau eine Leitung."
S1_SCHRITT7 = "Merker „Stromsparen aktiv“ anlegen (im Baum „Merker“ wählen, im Menüband „Merker“, auf die Seite klicken)."
S1_SCHRITT8 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein: „USV-Abfrage“ dreimal (V5–V7), „USV-Zustand“ zweimal (V5/V6). ODER und UND haben je zwei Eingänge. Die Zeilen der Status-Bausteine stehen in der Spalte „%s“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT9 = "Speichern und in den Miniserver übertragen. Probe: %s ändert sich alle 30 s; der Status „USV-Abfrage“ zeigt „in Ordnung – USV meldet ONLINE …“; im Plugin Reiter „%s“ → „%s“ steht dieselbe Ladung wie in Loxone."
S1_H1 = "Zu #8: Die Einschaltverzögerung fängt den kurzen Netzwischer ab. Ohne sie meldet das Haus jeden Spannungseinbruch von zwei Sekunden."
S1_H2 = "Zu #10 bis #12: Der Benachrichtigungs-Baustein meldet nur beim Wechsel von Aus auf Ein. „USV-Meldung“ kommt bei Stromausfall (nach 10 s), bei abgerissener Verbindung zur USV und bei gestörter Abfrage; hält eine dieser Störungen an, bleibt eine weitere stumm – das ODER davor ändert daran nichts. Eine Dauerstörung wie der Akkutausch hat deshalb eine eigene Meldung (#25), sie würde sonst jede spätere Meldung verschlucken."
S1_H3 = "Zu #13 und #14: Lastabwurf ab Stufe 2 (Vorwarnung). Den Merker „Stromsparen aktiv“ im eigenen Projekt an die Verbraucher legen, die bei knappem Akku aus sollen – erst Komfort, dann Nebenräume. Kennt die USV keine Abschaltschwellen, kommt Stufe 2 nie; auf der Seite „APC-UPS NG Akku und Netz“ sagt es der Status „USV Gerät“."
S1_H4 = "Zu #6 und #19: Loxone rechnet in Sekunden seit 2009, dieses Thema in Sekunden seit 1970. Die Analogwertvalidierung braucht den Wert nicht umzurechnen, sie prüft nur, ob er sich ändert – und nur mit der Konstante 1 an En. Tmc ist das Fünffache des Abfragetakts: wer „%s“ ändert, setzt Tmc auf das Fünffache des neuen Werts."
S1_H5 = "Zu #32: Hängt die USV am LoxBerry selbst, fährt apcupsd den LoxBerry herunter – danach kommt vom Plugin nichts mehr, bis er wieder läuft. Die Meldung geht vorher hinaus."
S1_H6 = "Zu #33 bis #35: Die Virtuellen Texteingänge stehen in keiner Vorlage. Peripherie → Virtuelle Eingänge → Virtueller Texteingang, Name genau wie in der Spalte „%s“ – den Namen vergibt das MQTT-Gateway."
S1_H7 = "Die Vorlage für den alten XML-Weg nicht zusätzlich zur MQTT-Vorlage einlesen – sie liefert fünf der Werte ein zweites Mal."
S1_H8 = "Die LoxBerry-Benachrichtigung des Plugins (Glocke, E-Mail) läuft daneben weiter; wer nur die Loxone-App will, schaltet sie im Reiter „%s“ unter „%s“ ab."
S2_SCHRITT1 = "Seite „APC-UPS NG“ zuerst übernehmen (Vorlage und Gateway wie dort, Schritte 1–3)."
S2_SCHRITT2 = "Sechs Virtuelle Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s, %s, %s, %s, %s, %s; „In Visualisierung verwenden“ an. Gateway V2: diese Datenpunkte ebenfalls anhaken."
S2_SCHRITT3 = "Neue Seite „APC-UPS NG Akku und Netz“. Aus „%s“ die 18 Eingänge der Liste (Nr. 1–18) ziehen – %s und %s ein zweites Mal, nicht neu anlegen. Bei %s, %s, %s und %s im Eigenschaftsfenster „Statistik“ einschalten."
S2_SCHRITT4 = "Vier Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „USV überlastet“, „USV zu warm“, „USV Akku lädt nicht“, „USV Netz unruhig“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
S2_SCHRITT5 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ verbinden. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein: „USV Akku“ und „USV Netz und Last“ viermal (V5–V8), „USV Gerät“ zweimal (V5/V6). Das UND hat zwei Eingänge. Die Zeilen der Status-Bausteine stehen in der Spalte „%s“ und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt. „Impuls um“ bleibt auf 00:00:00."
S2_SCHRITT6 = "Speichern und übertragen. Probe: „USV Gerät“ zeigt Modell und Abschaltschwellen; „USV Netz und Last“ zeigt dieselbe Netzspannung wie im Plugin Reiter „%s“ → „%s“."
S2_H1 = "Schwellen nach der eigenen USV wählen: Überlast 80/70 %, zu warm 40/35 °C, „Akku lädt nicht“ 6 Stunden unter 80 %. Liefert die USV keine Temperatur oder keine Netzfrequenz, steht dort 0 – dann wirkt die Meldung „zu warm“ nie."
S2_H2 = "Statistik ist eine Eigenschaft des Eingangs im Baum – sie gilt dann auch für %s auf der Seite „APC-UPS NG“."
S2_H3 = "Akkualter: ab 48 Monaten zeigt „USV Akku“ „Ersatz einplanen“; eine eigene Meldung gibt es bewusst nicht. Nach einem Akkutausch das Einbaudatum in der USV neu setzen (apcupsd-Programm apctest), sonst zählt das Alter weiter."
S2_H4 = "„Umschaltungen heute“ zählt ab Mitternacht. Nach einem Neustart des Miniservers steht sie bis zur nächsten Mitternacht auf 0; nach einem Neustart von apcupsd zählt apcupsd von vorn."
S2_H5 = "Selbsttest und Grund der letzten Umschaltung stehen so da, wie apcupsd sie meldet (Kürzel, englisch) – das Plugin übersetzt sie nicht."
SCHRITT7 = "Schritt 7: Gegenprobe"
SCHRITT7_TEXT = "Im MQTT-Gateway unter <i>Incoming overview</i> nachsehen: dort müssen die Themen mit dem Präfix erscheinen, sobald der Dienst einmal gesendet hat. Erscheinen sie dort nicht, fehlt das Abo aus Schritt 2 — dann ist alles Weitere in Loxone vergeblich. Erscheinen sie dort, aber nicht in Loxone, stimmen die Namen der virtuellen Eingänge nicht."
ALTER_WEG = "Der alte XML-Weg bleibt erhalten"
ALTER_WEG_TEXT = "Die Originalfassung stellte unter dieser Adresse eine XML-Seite bereit, die Loxone selbst abholt. Sie bleibt unverändert, damit bestehende Anlagen weiterlaufen. Seit 1.2.0 beachtet sie auch die Einstellung <i>USV auf einem anderen Rechner</i> und liefert zusätzlich zu den Rohfeldern die abgeleiteten Werte im Block <span class='sm-mono'>CALC</span> — dieselben, die über MQTT hinausgehen, samt ihrem Alter in Sekunden. Seit 1.2.14 stehen am Anfang des Blocks <span class='sm-mono'>OK</span> und <span class='sm-mono'>ALTER</span>: OK fällt auf 0, sobald die Werte älter sind als das Dreifache des Abfragetakts — etwa weil der Dienst steht; ALTER nennt dieses Alter in Sekunden."
ALTER_WEG_ADRESSE = "Der Rechnername ist ein Vorschlag. Bitte prüfen, unter welchem Namen der Miniserver den LoxBerry wirklich erreicht."
BILD_ALT = "Bausteine des Plugins in Loxone Config – Seite „%s“"
