[LOXONE]
SCHRITT1 = "Schritt 1: Weg festlegen"
SCHRITT1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt ein passend benannter virtueller Eingang. Der alte XML-Weg bleibt für bestehende Anlagen erhalten und ist weiter unten beschrieben. Zuerst im Reiter <b>Test</b> mit <i>Jetzt abfragen</i> prüfen, ob die USV überhaupt antwortet — kommen dort Werte, ist der schwierige Teil erledigt."
SCHRITT2 = "Schritt 2: Das Abo im MQTT-Gateway"
SCHRITT2_TEXT = "Die Themengruppe dieses Plugins lautet:"
SCHRITT3 = "Schritt 3: Virtuelle Eingänge anlegen"
SCHRITT3_TEXT = "Die Importdatei legt alle Eingänge samt Titel, Einheit und Grenzen an. In Loxone Config über <i>Vorlage einfügen</i> einlesen. Welche Themen es gibt und was sie bedeuten, steht im Reiter MQTT."
KNOPF_MQTT = "Vorlage für den MQTT-Weg erzeugen"
KNOPF_XML = "Vorlage für den alten XML-Weg erzeugen"
VORLAGE_ZAHL = "Die MQTT-Vorlage legt %d virtuelle Eingänge an. Die %d Textthemen sind bewusst nicht dabei: das nachgebaute Vorlagenformat ist nur für Zahlenwerte belegt, und ein analoger Eingang auf einem Text zeigt dauerhaft 0. Sie gehen trotzdem nicht verloren — das MQTT-Gateway legt beim ersten Empfang selbst einen passenden Eingang an."
IMPORT_DOPPELT = "Loxone Config legt beim Import neu an und überschreibt nichts. Zweimal importiert heißt doppelte Objekte."
SCHRITT4 = "Schritt 4: Befehle senden"
SCHRITT4_TEXT = "Dieses Plugin schaltet nichts an der USV. Es gibt deshalb keinen virtuellen Ausgang und keine Vorlage dafür. Der Grund ist nicht Bequemlichkeit: der Messdienst läuft bewusst ohne Rootrechte, und ein Befehl an die USV braucht sie. Was die USV bei leerem Akku tut, entscheidet apcupsd — siehe Reiter Einstellungen, Abschnitt Notabschaltung."
SCHRITT5 = "Schritt 5: Ausfallerkennung"
SCHRITT5_TEXT = "Ein virtueller Eingang behält seinen letzten Wert, wenn nichts mehr kommt. In der App sieht dann alles normal aus, obwohl längst nichts mehr gemessen wird. Drei Themen sind dagegen da: <span class='sm-mono'>service/online</span> fällt auf 0, sobald der Dienst stirbt (der Broker setzt das selbst, auch bei einem Absturz); <span class='sm-mono'>data_valid</span> fällt auf 0, wenn apcupsd die USV nicht mehr erreicht; und <span class='sm-mono'>timestamp</span> sagt, wann zuletzt gemessen wurde. Eine Zeitüberwachung auf timestamp sollte deutlich über dem eingestellten Abfragetakt liegen, damit ein einzelner verpasster Durchlauf keine Meldung auslöst."
SCHRITT6 = "Schritt 6: Komplette Baustein-Liste zum 1:1-Nachbauen"
