S1_SCHRITT1 = "apcupsd muss laufen und die USV sehen. Im Plugin Reiter „%s“ → „%s“: kommen Werte, ist der schwierige Teil erledigt. Im Reiter „%s“ „%s“ setzen, die Vorwarnung prüfen (ab Werk 5 Minuten bzw. 10 Prozentpunkte über der Abschaltschwelle) und speichern."
S1_SCHRITT2 = "LoxBerry → MQTT Gateway: das Abo %s trägt das Plugin selbst ein (Schritt 2 oben sagt, was bei Ihrem Gateway gilt). Gateway V2: die Haken aus Schritt 2 setzen; %s und %s zusätzlich auf „Noncached“."
S1_SCHRITT3 = "Die elf Virtuellen Eingänge dieser Seite anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Name genau so: %s. „Als Digitaleingang“ NICHT anhaken. Oben in Schritt 3 kopiert ein Knopf alle Namen."
S1_SCHRITT4 = "Drei Virtuelle Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s, %s, %s; „In Visualisierung verwenden“ an. So benennt das MQTT-Gateway die Werte (mit dem Themenpräfix aus dem Reiter MQTT) – ein anderer Name bekommt nie einen Wert."
S1_SCHRITT5 = "Seite „APC-UPS NG“ anlegen. Die elf Eingänge, die drei Texteingänge und die Konstante 1 darauf ziehen."
S1_SCHRITT6 = "Fünf Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „USV-Meldung“, „USV Akku tauschen“, „USV Netz wieder da“, „USV Akku bald leer“, „USV Abschaltung“, Texte wie in der Liste, und auf die Seite ziehen. Jede bekommt genau eine Leitung."
S1_SCHRITT7 = "Merker „Stromsparen aktiv“ anlegen (im Baum „Merker“ wählen, im Menüband „Merker“, auf die Seite klicken)."
S1_SCHRITT8 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. Die drei Formeln (#37 bis #39) stehen zwischen Eingang und Meldung. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein: „USV-Abfrage“ dreimal (V5–V7), „USV-Zustand“ zweimal (V5/V6). ODER und UND haben je zwei Eingänge. Die Zeilen der Status-Bausteine stehen in der Spalte „%s“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT9 = "Speichern und in den Miniserver übertragen. Probe: %s zählt alle 30 s eins weiter; der Status „USV-Abfrage“ zeigt „in Ordnung – USV meldet ONLINE …“; im Plugin Reiter „%s“ → „%s“ steht dieselbe Ladung wie in Loxone."
S1_H1 = "Zu #8: Die Einschaltverzögerung fängt den kurzen Netzwischer ab. Ohne sie meldet das Haus jeden Spannungseinbruch von zwei Sekunden."
S1_H2 = "Zu #10 bis #12: Der Benachrichtigungs-Baustein meldet nur beim Wechsel von Aus auf Ein. „USV-Meldung“ kommt bei Stromausfall (nach 10 s), bei abgerissener Verbindung zur USV und bei gestörter Abfrage; hält eine dieser Störungen an, bleibt eine weitere stumm – das ODER davor ändert daran nichts. Eine Dauerstörung wie der Akkutausch hat deshalb eine eigene Meldung (#25), sie würde sonst jede spätere Meldung verschlucken."
S1_H3 = "Zu #13 und #14: Lastabwurf ab Stufe 2 (Vorwarnung). Den Merker „Stromsparen aktiv“ im eigenen Projekt an die Verbraucher legen, die bei knappem Akku aus sollen – erst Komfort, dann Nebenräume. Kennt die USV keine Abschaltschwellen, kommt Stufe 2 nie; auf der Seite „APC-UPS NG Akku und Netz“ sagt es der Status „USV Gerät“."
S1_H4 = "Zu #6 und #19: Der Zähler läuft bei jedem Lauf des Dienstes eins weiter (0 bis 999), auch bei ausgeschaltetem Plugin. Die Analogwertvalidierung prüft nur, ob er sich ändert, und bekommt an En die Konstante 1. Tmc ist das Fünffache des Abfragetakts: wer „%s“ ändert, setzt Tmc auf das Fünffache des neuen Werts."
S1_H9 = "Zu #19: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
S1_H5 = "Zu #32: Hängt die USV am LoxBerry selbst, fährt apcupsd den LoxBerry herunter – danach kommt vom Plugin nichts mehr, bis er wieder läuft. Die Meldung geht vorher hinaus."
S1_H6 = "Zu #33 bis #35: Virtuelle Texteingänge (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau wie in der Spalte „%s“ – den Namen vergibt das MQTT-Gateway."
S1_H7 = "Zu #37 bis #39: -1 heißt „keine Aussage“ (apcupsd erreicht die USV nicht, antwortet nicht, oder das Plugin ist ausgeschaltet). Die Formeln lassen nur eine 1 durch – eine -1 löst weder die Einschaltverzögerung noch eine Benachrichtigung aus."
S1_H8 = "Die LoxBerry-Benachrichtigung des Plugins (Glocke, E-Mail) läuft daneben weiter; wer nur die Loxone-App will, schaltet sie im Reiter „%s“ unter „%s“ ab."
S2_SCHRITT1 = "Seite „APC-UPS NG“ zuerst übernehmen (Gateway und Namen wie dort, Schritte 1–3)."
S2_SCHRITT2 = "Sechs Virtuelle Texteingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so: %s, %s, %s, %s, %s, %s; „In Visualisierung verwenden“ an. Gateway V2: diese Datenpunkte ebenfalls anhaken."
S2_SCHRITT3 = "Neue Seite „APC-UPS NG Akku und Netz“. Die übrigen 16 Virtuellen Eingänge der Liste anlegen (Nr. 2–11 und 13–18, Name wie in der Tabelle, „Als Digitaleingang“ nicht anhaken); %s und %s stehen schon auf der Seite „APC-UPS NG“ – ein zweites Mal hineinziehen, nicht neu anlegen. Bei %s, %s, %s und %s im Eigenschaftsfenster „Statistik“ einschalten."
S2_SCHRITT4 = "Vier Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „USV überlastet“, „USV zu warm“, „USV Akku lädt nicht“, „USV Netz unruhig“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
S2_SCHRITT5 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ verbinden. Die Formel #43 steht zwischen #18 und dem UND #32. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein: „USV Akku“ und „USV Netz und Last“ viermal (V5–V8), „USV Gerät“ zweimal (V5/V6). Das UND hat zwei Eingänge. Die Zeilen der Status-Bausteine stehen in der Spalte „%s“ und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt. „Impuls um“ bleibt auf 00:00:00."
S2_SCHRITT6 = "Speichern und übertragen. Probe: „USV Gerät“ zeigt Modell und Abschaltschwellen; „USV Netz und Last“ zeigt dieselbe Netzspannung wie im Plugin Reiter „%s“ → „%s“."
S2_H1 = "Schwellen nach der eigenen USV wählen: Überlast 80/70 Proz., zu warm 40/35 °C, „Akku lädt nicht“ 6 Stunden unter 80 Proz. Liefert die USV keine Temperatur, steht dort -999 – dann wirkt die Meldung „zu warm“ nie; eine fehlende Netzfrequenz steht als -1 da."
S2_H2 = "Statistik ist eine Eigenschaft des Eingangs im Baum – sie gilt dann auch für %s auf der Seite „APC-UPS NG“."
S2_H3 = "Akkualter: ab 48 Monaten zeigt „USV Akku“ „Ersatz einplanen“; eine eigene Meldung gibt es bewusst nicht. Nach einem Akkutausch das Einbaudatum in der USV neu setzen (apcupsd-Programm apctest), sonst zählt das Alter weiter."
S2_H4 = "„Umschaltungen heute“ zählt ab Mitternacht und zeigt -1, solange die USV keine Aussage macht. Nach einem Neustart des Miniservers steht sie bis zur nächsten Mitternacht auf 0; nach einem Neustart von apcupsd zählt apcupsd von vorn."
S2_H5 = "Selbsttest und Grund der letzten Umschaltung stehen so da, wie apcupsd sie meldet (Kürzel, englisch) – das Plugin übersetzt sie nicht."
SCHRITT7 = "Schritt 7: Gegenprobe"
SCHRITT7_TEXT = "Im MQTT-Gateway unter <i>Incoming overview</i> nachsehen: dort müssen die Themen mit dem Präfix erscheinen, sobald der Dienst einmal gesendet hat. Erscheinen sie dort nicht, fehlt das Abo aus Schritt 2 — dann ist alles Weitere in Loxone vergeblich. Erscheinen sie dort, aber nicht in Loxone, stimmen die Namen der virtuellen Eingänge nicht."
