; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
;
; ERZEUGT von Werkzeuge/ap_hilfe_erzeugen.py - nicht von Hand aendern.
; Beide Sprachen kommen aus EINER Quelle; ein Schluessel kann deshalb
; nicht nur in einer stehen.
;
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der Hilfe.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst
; keine; Auszeichnung bleibt roh, die Hilfe wird nicht maskiert ausgegeben.

[HILFE]
K01 = "APC-UPS NG"
K02 = "Das Plugin liest eine APC-USV über <code>apcupsd</code> aus und meldet Zustand, Akkuladung, Restlaufzeit, Last und eine gestufte Alarmstufe per MQTT an den Loxone Miniserver. Bei Stromausfall und Netzrückkehr gibt es zusätzlich eine Benachrichtigung."
K03 = "Voraussetzung: apcupsd muss laufen"
K04 = "Das Plugin misst nichts selbst — es fragt <code>apcupsd</code> ab, den Dienst, der mit der USV spricht. Der wird bei der Installation mitgebracht und gestartet. Zwei Stolpersteine gibt es dabei:"
K05 = "In <code>/etc/default/apcupsd</code> steht nach der Paketinstallation <code>ISCONFIGURED=no</code>. Solange das so ist, startet apcupsd nicht. Die Installation dieses Plugins setzt den Wert auf <code>yes</code> — das ist die einzige Systemdatei, die angefasst wird."
K06 = "Die USV muss per USB angeschlossen und erkannt sein. Im Reiter <i>Test</i> zeigt <i>apcupsd prüfen</i> die angeschlossenen USB-Geräte."
K07 = "Einrichtung in sieben Schritten"
K08 = "<b>Reiter Test → Jetzt abfragen.</b> Kommen dort Werte, ist der schwierige Teil erledigt. Die Selbstprüfung darüber beantwortet Zeile für Zeile, was noch fehlt."
K09 = "<b>Das Abo im MQTT-Gateway eintragen.</b> Ohne diesen Eintrag kommt am Miniserver nichts an — das ist die häufigste Fehlerursache überhaupt. Das einzutragende Thema steht im Reiter <i>MQTT</i> zum Abschreiben. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K10 = "<b>Reiter Einbindung in Loxone → Vorlage herunterladen</b> und in Loxone Config über <i>Vorlage einfügen</i> einlesen. Die vollständige Baustein-Liste im selben Reiter zeigt, was danach zu verdrahten ist."
K11 = "Was veröffentlicht wird"
K12 = "Die vollständige Liste mit Art, Einheit und Bedeutung steht im Reiter <i>MQTT</i>. <b>Nicht alle Themen sind retained.</b> Zustände wie Modell, Seriennummer oder <code>on_battery</code> bleiben im Broker liegen, damit ein neu verbundener Abnehmer sie sofort kennt. Messwerte wie die Restlaufzeit dagegen nicht: wer sich nach einer Stunde neu verbindet, bekäme sonst eine stundenalte Restlaufzeit serviert und hielte sie für aktuell. Welche Themen retained sind, sagt die Spalte in der Tabelle; wie frisch ein Wert ist, sagt <code>timestamp</code>."
K13 = "Was sich zum Schalten anbietet"
K14 = "<code>alarm_level</code> ist der Wert, für den sich der Aufwand lohnt: 0 Netzbetrieb, 1 Akkubetrieb, 2 Vorwarnung, 3 apcupsd fährt jetzt herunter. Die Schwellen für 2 und 3 liest das Plugin aus apcupsd selbst aus, sie sind nicht geraten. Damit kann der Miniserver Verbraucher gestaffelt abwerfen, statt vom Systemhalt überrascht zu werden. <code>on_battery</code> genügt für die einfache Meldung, <code>time_left</code> sagt, wie lange noch Zeit bleibt."
K15 = "Der alte XML-Weg"
K16 = "Die Originalfassung stellte eine XML-Seite bereit, die Loxone selbst abholt. Diese Seite gibt es weiterhin und liefert dieselbe Struktur — wer sie eingebunden hat, muss nichts ändern. Seit 1.2.0 beachtet sie auch die Einstellung <i>USV auf einem anderen Rechner</i> und liefert die abgeleiteten Werte im Block <code>CALC</code> mit, samt ihrem Alter in Sekunden. Für neue Anlagen ist MQTT trotzdem der bessere Weg: der Miniserver muss nichts abfragen, und es kommen deutlich mehr Größen heraus."
K17 = "Benachrichtigungen"
K18 = "Beim Wechsel zwischen Netz- und Akkubetrieb legt das Plugin eine Meldung im LoxBerry-Benachrichtigungsbereich ab (Glockensymbol oben). Ob das funktioniert, zeigt im Reiter <i>Test</i> der Knopf <i>Testmeldung ablegen</i>. Seit 1.2.0 wird auch der Zustand beim Start des Dienstes gemeldet — wer den Dienst während eines Stromausfalls neu startete, bekam vorher keine Meldung, weil es keinen Wechsel gab."
K19 = "Zusätzlich kann eine E-Mail verschickt werden. Das setzt voraus, dass auf dem LoxBerry ein Mailversand eingerichtet ist — sonst passiert stillschweigend nichts, und der Grund steht im Protokoll."
K20 = "Notabschaltung bei leerem Akku"
K21 = "Das entscheidet <b>apcupsd</b>, nicht dieses Plugin. Die Schwellen stehen in <code>/etc/apcupsd/apcupsd.conf</code> unter <code>BATTERYLEVEL</code>, <code>MINUTES</code> und <code>TIMEOUT</code>. Das Plugin liest sie aus und zeigt die <b>tatsächlich geltenden</b> Werte im Reiter <i>Einstellungen</i> an — es nennt hier bewusst keine Vorgabewerte, weil sie je nach Paketfassung und Gerät verschieden sind."
K22 = "USV an einem anderen Rechner"
K23 = "Hängt die USV nicht am LoxBerry selbst, sondern an einem anderen Rechner mit apcupsd, lässt sich dessen Adresse im Reiter <i>Einstellungen</i> unter <i>USV auf einem anderen Rechner</i> eintragen. Dort muss apcupsd den Netzzugriff erlauben (<code>NETSERVER on</code>). Seit 1.2.0 gilt die Einstellung auch für den alten XML-Weg; vorher fragte der stillschweigend die örtliche USV ab."
K24 = "Wenn nichts kommt"
K25 = "<b>Reiter Test → Selbstprüfung:</b> die Zeilen dort beantworten der Reihe nach, woran es hängt — von apcaccess über den eigenen Dienst bis zum Abo im Gateway."
K26 = "<b>Reiter Test → Jetzt abfragen:</b> zeigt die Fehlermeldung von <code>apcaccess</code> im Klartext."
K27 = "<b>Reiter Logdateien:</b> dort steht die Ursache."
K28 = "Herkunft"
K29 = "Grundlage ist das Plugin von Christian Woerstenfeld, Apache-Lizenz 2.0. Die von der Lizenz verlangte Nennung steht in <code>NOTICE</code>, in <code>README.md</code> und im Kopf der Python-Dateien. In <code>plugin.cfg</code> stehen dagegen Name und E-Mail dieser Fortführung — LoxBerry benutzt beide als <b>Kennung</b> des Plugins, nicht als Urhebervermerk; die Kennung eines fremden Plugins zu tragen und gleichzeitig auf ein anderes Repository zu zeigen, ergäbe eine Mischform, die LoxBerry nicht auflösen kann."
K30 = "Thema"
K31 = "Bedeutung"
K32 = "<code>status</code>"
K33 = "Zustandstext, z.&nbsp;B. ONLINE oder ONBATT"
K34 = "<code>alarm_level</code>"
K35 = "0 Netz, 1 Akku, 2 Vorwarnung, 3 Abschaltung läuft. Leer bei abgerissener Verbindung"
K36 = "<code>on_battery</code>"
K37 = "1 = Netzausfall, die USV speist aus dem Akku"
K38 = "<code>data_valid</code>"
K39 = "0 = apcupsd erreicht die USV nicht; die übrigen Zahlen sind dann wertlos"
K40 = "<code>battery_charge</code>"
K41 = "Akkuladung in Prozent"
K42 = "<code>time_left</code>"
K43 = "verbleibende Laufzeit in Minuten"
K44 = "<code>load_watt</code>"
K45 = "geschätzte Last in Watt"
K46 = "<code>replace_battery</code>"
K47 = "1 = die USV hält einen Akkutausch für fällig"
K48 = "<code>battery_age_months</code>"
K49 = "Alter des Akkus in Monaten. Leer, wenn das Datumsformat der USV zweideutig ist"
K50 = "<code>timestamp</code>"
K51 = "Sekunden seit 1970 zum Zeitpunkt der Messung — daran erkennt Loxone einen alten Wert"
K52 = "<code>event</code>"
K53 = "Kurztext beim Zustandswechsel"
