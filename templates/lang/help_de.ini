; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "APC-UPS NG"
K02 = "Das Plugin liest eine APC-USV über <code>apcupsd</code> aus und meldet Zustand, Akkuladung, Restlaufzeit und Last per MQTT an den Loxone Miniserver. Bei Stromausfall und Netzrückkehr gibt es zusätzlich eine Benachrichtigung."
K03 = "Voraussetzung: apcupsd muss laufen"
K04 = "Das Plugin misst nichts selbst — es fragt <code>apcupsd</code> ab, den Dienst, der mit der USV spricht. Der wird bei der Installation mitgebracht und gestartet. Zwei Stolpersteine gibt es dabei:"
K05 = "In <code>/etc/default/apcupsd</code> steht nach der Paketinstallation <code>ISCONFIGURED=no</code>. Solange das so ist, startet apcupsd nicht. Die Installation dieses Plugins setzt den Wert auf <code>yes</code> — das ist die einzige Systemdatei, die angefasst wird."
K06 = "Die USV muss per USB angeschlossen und erkannt sein. Im Reiter <i>Test</i> zeigt <i>apcupsd prüfen</i> die angeschlossenen USB-Geräte."
K07 = "Einrichtung in drei Schritten"
K08 = "<b>Reiter Test → Jetzt abfragen.</b> Kommen dort Werte, ist der schwierige Teil erledigt."
K09 = "<b>Reiter Einbindung in Loxone → Vorlage herunterladen</b> und in Loxone Config über <i>Vorlage einfügen</i> einlesen."
K10 = "<b>Eingänge mit dem MQTT-Gateway verbinden.</b> Die Vorlage legt nur die Namen an; die Werte liefert das Gateway."
K11 = "Was veröffentlicht wird"
K12 = "Die vollständige Liste steht im Reiter <i>Einbindung in Loxone</i>. Alle Themen sind <b>retained</b>: der Broker merkt sich den letzten Wert, nach einem Neustart des Miniservers ist der Zustand sofort wieder da."
K13 = "Was sich zum Schalten anbietet"
K14 = "<code>on_battery</code> ist der Wert, auf den es meistens ankommt. Damit lassen sich unkritische Verbraucher abwerfen, eine Meldung ausgeben oder laufende Vorgänge anhalten. <code>time_left</code> sagt, wie lange noch Zeit bleibt."
K15 = "Der alte XML-Weg"
K16 = "Die Originalfassung stellte eine XML-Seite bereit, die Loxone selbst abholt. Diese Seite gibt es weiterhin und liefert dieselbe Struktur — wer sie eingebunden hat, muss nichts ändern. Für neue Anlagen ist MQTT der bessere Weg: der Miniserver muss nichts abfragen, die Werte überleben einen Neustart, und es kommen deutlich mehr Größen heraus."
K17 = "Benachrichtigungen"
K18 = "Beim Wechsel zwischen Netz- und Akkubetrieb legt das Plugin eine Meldung im LoxBerry-Benachrichtigungsbereich ab (Glockensymbol oben). Ob das funktioniert, zeigt im Reiter <i>Test</i> der Knopf <i>Testmeldung ablegen</i>."
K19 = "Zusätzlich kann eine E-Mail verschickt werden. Das setzt voraus, dass auf dem LoxBerry ein Mailversand eingerichtet ist — sonst passiert stillschweigend nichts, und der Grund steht im Protokoll."
K20 = "Notabschaltung bei leerem Akku"
K21 = "Das entscheidet <b>apcupsd</b>, nicht dieses Plugin. Die Schwellen stehen in <code>/etc/apcupsd/apcupsd.conf</code> unter <code>BATTERYLEVEL</code>, <code>MINUTES</code> und <code>TIMEOUT</code>. Voreingestellt fährt apcupsd herunter, wenn der Akku unter 5&nbsp;% fällt oder weniger als 3&nbsp;Minuten bleiben."
K22 = "USV an einem anderen Rechner"
K23 = "Hängt die USV nicht am LoxBerry selbst, sondern an einem anderen Rechner mit apcupsd, lässt sich dessen Adresse im Reiter <i>Einstellungen</i> unter <i>USV-Host</i> eintragen. Dort muss apcupsd den Netzzugriff erlauben (<code>NETSERVER on</code>)."
K24 = "Wenn nichts kommt"
K25 = "<b>Reiter Test → apcupsd prüfen:</b> läuft der Dienst, steht <code>ISCONFIGURED</code> auf <code>yes</code>, taucht die USV bei <code>lsusb</code> auf?"
K26 = "<b>Reiter Test → Jetzt abfragen:</b> zeigt die Fehlermeldung von <code>apcaccess</code> im Klartext."
K27 = "<b>Reiter Logdateien:</b> dort steht die Ursache."
K28 = "Herkunft"
K29 = "Grundlage ist das Plugin von Christian Woerstenfeld, Apache-Lizenz 2.0. Die Autorenangabe in <code>plugin.cfg</code> bleibt unverändert — LoxBerry identifiziert ein Plugin darüber. Was gegenüber der Originalfassung geändert wurde, steht in der Datei <code>README.md</code> im Plugin-Ordner."
K30 = "Thema"
K31 = "Bedeutung"
K32 = "<code>status</code>"
K33 = "Zustandstext, z.&nbsp;B. ONLINE oder ONBATT"
K34 = "<code>on_battery</code>"
K35 = "1 = Netzausfall, die USV speist aus dem Akku"
K36 = "<code>battery_charge</code>"
K37 = "Akkuladung in Prozent"
K38 = "<code>time_left</code>"
K39 = "verbleibende Laufzeit in Minuten"
K40 = "<code>load_watt</code>"
K41 = "geschätzte Last in Watt"
K42 = "<code>replace_battery</code>"
K43 = "1 = die USV hält einen Akkutausch für fällig"
K44 = "<code>event</code>"
K45 = "Kurztext beim Zustandswechsel"
