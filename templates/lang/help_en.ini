; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "APC-UPS NG"
K02 = "The plugin reads an APC UPS through <code>apcupsd</code> and reports the state, battery charge, remaining runtime and load to the Loxone Miniserver through MQTT. On a power failure and on the return of mains power there is a notification as well."
K03 = "Prerequisite: apcupsd has to be running"
K04 = "The plugin measures nothing itself — it queries <code>apcupsd</code>, the service that talks to the UPS. That is installed and started along with the plugin. There are two stumbling blocks:"
K05 = "After the package installation, <code>/etc/default/apcupsd</code> contains <code>ISCONFIGURED=no</code>. As long as it says that, apcupsd does not start. Installing this plugin sets the value to <code>yes</code> — that is the only system file that is touched."
K06 = "The UPS has to be connected by USB and recognised. On the <i>Test</i> tab, <i>Check apcupsd</i> shows the connected USB devices."
K07 = "Setting up in three steps"
K08 = "<b>Test tab → Query now.</b> If values appear there, the difficult part is done."
K09 = "<b>Loxone integration tab → Download the template</b> and import it into Loxone Config with <i>Paste template</i>."
K10 = "<b>Connect the inputs to the MQTT gateway.</b> The template only creates the names; the values come from the gateway."
K11 = "What is published"
K12 = "The complete list is on the <i>Loxone integration</i> tab. All topics are <b>retained</b>: the broker remembers the last value, so after a restart of the Miniserver the state is there again immediately."
K13 = "What lends itself to switching"
K14 = "<code>on_battery</code> is the value that usually matters. With it you can shed non-critical loads, issue a message or halt running processes. <code>time_left</code> says how much time is left."
K15 = "The old XML route"
K16 = "The original version provided an XML page that Loxone fetches itself. That page still exists and delivers the same structure — anyone who has it wired up needs to change nothing. For new installations MQTT is the better route: the Miniserver does not have to poll, the values survive a restart, and considerably more quantities come out."
K17 = "Notifications"
K18 = "When the supply switches between mains and battery, the plugin files a message in the LoxBerry notification area (the bell icon at the top). Whether that works is shown on the <i>Test</i> tab by the <i>File a test message</i> button."
K19 = "An e-mail can be sent in addition. That requires mail sending to be set up on the LoxBerry — otherwise nothing happens, silently, and the reason appears in the log."
K20 = "Emergency shutdown on an empty battery"
K21 = "That is decided by <b>apcupsd</b>, not by this plugin. The thresholds are in <code>/etc/apcupsd/apcupsd.conf</code> under <code>BATTERYLEVEL</code>, <code>MINUTES</code> and <code>TIMEOUT</code>. By default apcupsd shuts down when the battery falls below 5&nbsp;% or less than 3&nbsp;minutes remain."
K22 = "A UPS on another machine"
K23 = "If the UPS is not attached to the LoxBerry itself but to another machine running apcupsd, that machine's address can be entered on the <i>Settings</i> tab under <i>UPS host</i>. apcupsd there has to allow network access (<code>NETSERVER on</code>)."
K24 = "If nothing arrives"
K25 = "<b>Test tab → Check apcupsd:</b> is the service running, does <code>ISCONFIGURED</code> say <code>yes</code>, does the UPS appear in <code>lsusb</code>?"
K26 = "<b>Test tab → Query now:</b> shows the error message from <code>apcaccess</code> in plain text."
K27 = "<b>Log files tab:</b> the reason is in there."
K28 = "Origin"
K29 = "The basis is the plugin by Christian Woerstenfeld, Apache licence 2.0. The author entry in <code>plugin.cfg</code> stays unchanged — LoxBerry identifies a plugin by it. What has changed compared with the original is described in <code>README.md</code> in the plugin folder."
K30 = "Topic"
K31 = "Meaning"
K32 = "<code>status</code>"
K33 = "State text, for example ONLINE or ONBATT"
K34 = "<code>on_battery</code>"
K35 = "1 = mains failure, the UPS is feeding from the battery"
K36 = "<code>battery_charge</code>"
K37 = "Battery charge in per cent"
K38 = "<code>time_left</code>"
K39 = "remaining runtime in minutes"
K40 = "<code>load_watt</code>"
K41 = "estimated load in watts"
K42 = "<code>replace_battery</code>"
K43 = "1 = the UPS considers a battery replacement due"
K44 = "<code>event</code>"
K45 = "Short text on a change of state"
