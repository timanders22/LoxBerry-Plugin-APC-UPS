;
; ERZEUGT von Werkzeuge/ap_hilfe_erzeugen.py - nicht von Hand aendern.
; Beide Sprachen kommen aus EINER Quelle; ein Schluessel kann deshalb
; nicht nur in einer stehen.
;
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der Hilfe.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst
; keine; Auszeichnung bleibt roh, die Hilfe wird nicht maskiert ausgegeben.

[HILFE]
K01 = "APC-UPS NG"
K02 = "The plugin reads an APC UPS through <code>apcupsd</code> and reports state, battery charge, remaining runtime, load and a staged alarm level over MQTT to the Loxone Miniserver. On power failure and return there is also a notification."
K03 = "Requirement: apcupsd must be running"
K04 = "The plugin measures nothing itself — it queries <code>apcupsd</code>, the service that talks to the UPS. It is installed and started along with the plugin. There are two pitfalls:"
K05 = "After the package installation <code>/etc/default/apcupsd</code> contains <code>ISCONFIGURED=no</code>. While that is the case apcupsd does not start. Installing this plugin sets the value to <code>yes</code> — that is the only system file it touches."
K06 = "The UPS must be connected by USB and recognised. In the <i>Test</i> tab <i>Check apcupsd</i> shows the connected USB devices."
K07 = "Setup in seven steps"
K08 = "<b>Test tab → Query now.</b> If values arrive there, the hard part is done. The self-check above answers line by line what is still missing."
K09 = "<b>Enter the subscription in the MQTT gateway.</b> Without this entry nothing arrives at the Miniserver — this is the most common cause of failure by far. The topic to enter is shown in the <i>MQTT</i> tab."
K10 = "<b>Loxone integration tab → download the template</b> and read it into Loxone Config via <i>Insert template</i>. The complete list of blocks in the same tab shows what to wire up afterwards."
K11 = "What is published"
K12 = "The complete list with type, unit and meaning is in the <i>MQTT</i> tab. <b>Not all topics are retained.</b> States such as model, serial number or <code>on_battery</code> stay in the broker so that a newly connected subscriber knows them immediately. Measurements such as the remaining runtime are not: anyone reconnecting after an hour would otherwise be served an hour-old runtime and take it for current. Which topics are retained is shown by the column in the table; how fresh a value is, is told by <code>timestamp</code>."
K13 = "What is useful for switching"
K14 = "<code>alarm_level</code> is the value worth the effort: 0 on mains, 1 on battery, 2 advance warning, 3 apcupsd is shutting down now. The thresholds for 2 and 3 are read from apcupsd itself, they are not guessed. This lets the Miniserver shed loads in stages instead of being surprised by the halt. <code>on_battery</code> is enough for a simple message, <code>time_left</code> says how much time is left."
K15 = "The old XML path"
K16 = "The original version provided an XML page that Loxone fetches itself. That page still exists and returns the same structure — anyone who has wired it up need not change anything. Since 1.2.0 it also honours the setting <i>UPS on another machine</i> and includes the derived values in a <code>CALC</code> block, together with their age in seconds. For new installations MQTT is still the better path: the Miniserver has to query nothing, and considerably more values are available."
K17 = "Notifications"
K18 = "On a change between mains and battery operation the plugin creates a message in the LoxBerry notification area (bell symbol at the top). Whether this works is shown by the <i>Create test notification</i> button in the <i>Test</i> tab. Since 1.2.0 the state at service start is reported as well — previously, restarting the service during a power failure produced no message because there was no change."
K19 = "An email can be sent in addition. This requires a working mail setup on the LoxBerry — otherwise nothing happens silently, and the reason is in the log."
K20 = "Emergency shutdown on empty battery"
K21 = "This is decided by <b>apcupsd</b>, not by this plugin. The thresholds are in <code>/etc/apcupsd/apcupsd.conf</code> under <code>BATTERYLEVEL</code>, <code>MINUTES</code> and <code>TIMEOUT</code>. The plugin reads them and shows the <b>values actually in force</b> in the <i>Settings</i> tab — it deliberately quotes no defaults here, because they differ between package versions and devices."
K22 = "UPS on another machine"
K23 = "If the UPS is not connected to the LoxBerry itself but to another machine running apcupsd, its address can be entered in the <i>Settings</i> tab under <i>UPS on another machine</i>. apcupsd there must allow network access (<code>NETSERVER on</code>). Since 1.2.0 the setting also applies to the old XML path; before that it silently queried the local UPS."
K24 = "When nothing arrives"
K25 = "<b>Test tab → self-check:</b> the lines there answer in order what the problem is — from apcaccess through the plugin service to the subscription in the gateway."
K26 = "<b>Test tab → Query now:</b> shows the error message from <code>apcaccess</code> in plain text."
K27 = "<b>Log files tab:</b> the cause is there."
K28 = "Origin"
K29 = "This is based on the plugin by Christian Woerstenfeld, Apache License 2.0. The attribution required by the license is in <code>NOTICE</code>, in <code>README.md</code> and in the header of the Python files. <code>plugin.cfg</code>, in contrast, carries the name and email of this continuation — LoxBerry uses both as the <b>identifier</b> of the plugin, not as an attribution; carrying the identifier of a foreign plugin while pointing at a different repository would produce a hybrid that LoxBerry cannot resolve."
K30 = "Topic"
K31 = "Meaning"
K32 = "<code>status</code>"
K33 = "State text, for example ONLINE or ONBATT"
K34 = "<code>alarm_level</code>"
K35 = "0 mains, 1 battery, 2 advance warning, 3 shutdown running. Empty when the connection is lost"
K36 = "<code>on_battery</code>"
K37 = "1 = power failure, the UPS is running on battery"
K38 = "<code>data_valid</code>"
K39 = "0 = apcupsd cannot reach the UPS; the other numbers are worthless then"
K40 = "<code>battery_charge</code>"
K41 = "Battery charge in percent"
K42 = "<code>time_left</code>"
K43 = "Remaining runtime in minutes"
K44 = "<code>load_watt</code>"
K45 = "Estimated load in watts"
K46 = "<code>replace_battery</code>"
K47 = "1 = the UPS considers a battery replacement due"
K48 = "<code>battery_age_months</code>"
K49 = "Age of the battery in months. Empty if the date format of the UPS is ambiguous"
K50 = "<code>timestamp</code>"
K51 = "Seconds since 1970 at the time of measurement — this is how Loxone recognises a stale value"
K52 = "<code>event</code>"
K53 = "Short text on a state change"
