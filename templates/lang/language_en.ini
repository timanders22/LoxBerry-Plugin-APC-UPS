SICH_KOPF_WARNUNG = "Caution: this file would be rejected on restore. Affected settings: %s"
HAUS_USV_EIN = "Pass the level on to other plugins (haus/usv/stufe)"
HAUS_USV_HILFE = "Sends the alarm level of the UPS as <span class='sm-mono'>haus/usv/stufe</span> (0 mains, 1 battery, 2 advance warning, 3 shutdown, -1 no statement; retained) and the heartbeat <span class='sm-mono'>haus/usv/zaehler</span> to the broker – without the topic prefix, for other plugins (rules no. 15). Only one UPS in the house may provide it. Consumers (e.g. local voice control) can use it to pause services when the battery runs low. Only works with MQTT. When switched off, the plugin removes the topic from the broker again. Off by default."
ANSAGE_UEBERSCHRIFT = "Voice announcement on power failure"
ANSAGE_LAUTSPRECHER = "<b>During a power failure, speakers, Echo, router and Wi-Fi are often NOT connected to the UPS</b> – then the announcement does not arrive. It only helps if the whole path (LoxBerry, network, output device) runs through the UPS. The notifications (LoxBerry, email, Loxone app) remain the reliable way. If apcupsd shuts down the LoxBerry itself, the shutdown announcement may be cut off."
ANSAGE_AUDIOSERVER = "Original Audio Server: it has no interface for plugins – there Loxone announces through the notifications of the sample page. The output is on by default; with the output type “off” the service never speaks."
ANSAGE_ANLAESSE = "Announce on"
ANSAGE_AUSFALL = "power failure (urgent)"
ANSAGE_RUECKKEHR = "power back (only after an announced failure)"
ANSAGE_VORWARNUNG = "advance warning (battery low soon, urgent)"
ANSAGE_ABSCHALTUNG = "shutdown begins (urgent)"
ANSAGE_ANLAESSE_HILFE = "At most one announcement per query, the most urgent one. Power failure, advance warning and shutdown go out as “urgent”: they also speak during quiet hours, and Alexa NG overrides “Do not disturb”. “Mains back” only speaks after an announced failure and not at night. Lost connection to the UPS and battery replacement are not announced – the notifications are there for that."
ANSAGE_SPERRE = "Same occasion at most every … seconds"
ANSAGE_SPERRE_HILFE = "60 to 3600, default 600. Prevents one announcement per transfer on an unsteady mains; per failure the advance warning and the shutdown announcement come at most once anyway."
ANSAGE_TEST = "Test announcement"
ANSAGE_TEST_HILFE = "Speaks the test sentence through the <b>saved</b> output type – save first, then test."
K_TESTANSAGE = "Speak test announcement"
ANSAGE_TEST_OK = "Test announcement sent."
ANSAGE_TEST_NICHTS = "Test announcement not sent: %s"
ANSAGE_TEST_FEHL = "Test announcement failed: %s"
