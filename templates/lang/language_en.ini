K_ZURUECK = "Restore"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin and can be restored there."
SICH_WARNUNG = "<b>What the file contains:</b> all settings of the Settings and MQTT tabs, including the UPS host and the email recipient. It contains no credentials — LoxBerry itself manages the login to the MQTT broker — and the form marker stays on this LoxBerry. Whoever passes the file on passes on host names and recipients, nothing else."
