[EINST]
WAS_IST_DAS = "<b>Watchdog for an APC UPS on the LoxBerry.</b> The plugin reads the UPS through apcupsd – state, battery charge, runtime left, load and a graded alarm level – and reports the values over MQTT to the Loxone Miniserver. On a power failure and when mains power returns there is also a LoxBerry notification, and an email on request. The plugin does not switch anything on the UPS; whether and when the LoxBerry shuts down on an empty battery is decided by apcupsd."
AKTUELLER_ZUSTAND = "Current state"
NETZAUSFALL = "power failure"
NOCH_KEINE_WERTE = "No values yet. The <b>Test</b> tab shows with <i>Query now</i> whether the UPS answers."
BETRIEB = "Operation"
PLUGIN_EINGESCHALTET = "Plugin switched on"
PLUGIN_EINGESCHALTET_HILFE = "While this is unchecked the service keeps running and reports in (heartbeat), but does not query the UPS: all states and measured values are set to “no statement” (-1), last error “Plugin ausgeschaltet”."
INTERVALL = "Query every … seconds"
AKTUALISIERUNG = "Republish everything every … seconds"
AKTUALISIERUNG_HILFE = "Otherwise only changed values are sent."
HOST = "UPS on another machine"
HOST_HILFE = "Leave empty for the local UPS. Otherwise the host name or address of the machine running apcupsd — optionally with <span class='sm-mono'>:port</span>. Since 1.2.0 this also applies to the old XML endpoint."
VORWARNUNG = "Advance warning before shutdown"
VORWARNUNG_HILFE = "Whether and when the LoxBerry shuts down is decided by apcupsd — not by this plugin. The plugin does read the thresholds and reports through <span class='sm-mono'>alarm_level</span> how close it is: 0 mains, 1 on battery, 2 advance warning, 3 apcupsd is shutting down now. This lets the Miniserver shed loads in stages instead of being surprised by the halt. If the UPS reports no thresholds, level 1 is the maximum — an invented threshold would be worse than no staging."
VORWARN_MIN = "Advance warning from … minutes above the threshold"
VORWARN_PROZENT = "Advance warning from … percentage points above the threshold"
LOG_KB = "Log file at most … kilobytes"
LOG_KB_HILFE = "The log folder is on a RAM disk. When the limit is exceeded the service cuts away the older half."
MELDEWEGE = "Notification paths on a state change"
BENACHRICHTIGUNG = "LoxBerry notification"
BENACHRICHTIGUNG_HILFE = "Appears at the top of the LoxBerry interface under the bell symbol."
EMAIL = "Additionally send an email"
EMAIL_HILFE = "The path of the original version, using <span class='sm-mono'>sendmail</span>. Requires a working mail setup on the LoxBerry."
EMAIL_AN = "Email to"
EMAIL_AN_HILFE = "The default is the local user <span class='sm-mono'>root</span>. Where this actually ends up is decided by the mail configuration of the system."
