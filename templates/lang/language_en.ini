SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
BL_S1 = "State, faults and power failure"
BL_S2 = "Battery, mains and load"
S1_SCHRITT1 = "apcupsd must be running and see the UPS. In the plugin, tab “%s” → “%s”: if values arrive, the hard part is done. On the tab “%s” tick “%s”, check the advance warning (by default 5 minutes or 10 percentage points above the shutdown threshold) and save."
S1_SCHRITT2 = "LoxBerry → MQTT Gateway: the plugin enters the subscription %s itself (step 2 above says what applies to your gateway). Gateway V2: set the ticks from step 2; additionally set %s and %s to “Noncached”."
S1_SCHRITT3 = "Create the eleven virtual inputs of this page (Periphery → Virtual Inputs → Virtual input), name exactly like this: %s. Do NOT tick “Use as digital input”. Above in step 3 a button copies all names."
S1_SCHRITT4 = "Create three virtual text inputs (Periphery → Virtual Inputs → Virtual text input), name exactly like this: %s, %s, %s; “Use in visualisation” on. This is how the MQTT gateway names the values (with the topic prefix from the MQTT tab) – any other name never gets a value."
S1_SCHRITT5 = "Create the page “APC-UPS NG”. Drag the eleven inputs, the three text inputs and the constant 1 onto it."
S1_SCHRITT6 = "Create five notifications (Periphery → Messages → Notification): “USV-Meldung”, “USV Akku tauschen”, “USV Netz wieder da”, “USV Akku bald leer”, “USV Abschaltung”, texts as in the list, and drag them onto the page. Each gets exactly one connection."
S1_SCHRITT7 = "Create the memory flag “Stromsparen aktiv” (select “Memory flags” in the tree, “Memory flag” in the ribbon, click on the page)."
S1_SCHRITT8 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “%s”. The three formulas (#37 to #39) sit between input and notification. Status inputs from V5 only appear after clicking the “+” on the block: “USV-Abfrage” three times (V5–V7), “USV-Zustand” twice (V5/V6). OR and AND have two inputs each. The rows of the status blocks are in the column “%s” and are entered by hand – in the given order, the row without condition last."
S1_SCHRITT9 = "Save and transfer to the Miniserver. Test: %s counts up by one every 30 s; the status “USV-Abfrage” shows “OK – UPS reports ONLINE …”; in the plugin, tab “%s” → “%s” shows the same charge as Loxone."
S1_H1 = "On #8: the on-delay absorbs short mains dips. Without it the house reports every two-second voltage drop."
S1_H2 = "On #10 to #12: the notification block only reports on a change from off to on. “USV-Meldung” comes on a power failure (after 10 s), on a lost connection to the UPS and on a disturbed query; while one of these faults persists, another one stays silent – the OR in front of it does not change that. A permanent fault such as the battery replacement therefore has its own notification (#25); otherwise it would swallow every later message."
S1_H3 = "On #13 and #14: load shedding from level 2 (advance warning). In your own project connect the memory flag “Stromsparen aktiv” to the loads that should switch off when the battery runs low – comfort first, then side rooms. If the UPS knows no shutdown thresholds, level 2 never comes; on the page “APC-UPS NG Akku und Netz” the status “USV Gerät” says so."
S1_H4 = "On #6 and #19: the counter counts up by one on every run of the service (0 to 999), also with the plugin switched off. The analog value validation only checks whether it changes, and gets the constant 1 at En. Tmc is five times the query interval: whoever changes “%s” sets Tmc to five times the new value."
S1_H9 = "On #19: Config creates input En inverted (tick at ‚En‘ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
S1_H5 = "On #32: if the UPS is connected to the LoxBerry itself, apcupsd shuts the LoxBerry down – after that nothing comes from the plugin until it runs again. The notification goes out before."
S1_H6 = "On #33 to #35: virtual text inputs (Periphery → Virtual Inputs → Virtual text input), name exactly as in the column “%s” – the MQTT gateway assigns the name."
S1_H7 = "On #37 to #39: -1 means “no statement” (apcupsd cannot reach the UPS, does not answer, or the plugin is switched off). The formulas only let a 1 through – a -1 triggers neither the on-delay nor a notification."
S1_H8 = "The LoxBerry notification of the plugin (bell, email) keeps running alongside; if you only want the Loxone app, switch it off on the tab “%s” under “%s”."
S2_SCHRITT1 = "Take over the page “APC-UPS NG” first (gateway and names as there, steps 1–3)."
S2_SCHRITT2 = "Create six virtual text inputs (Periphery → Virtual Inputs → Virtual text input), name exactly like this: %s, %s, %s, %s, %s, %s; “Use in visualisation” on. Gateway V2: tick these data points as well."
S2_SCHRITT3 = "New page “APC-UPS NG Akku und Netz”. Create the remaining 16 virtual inputs of the list (no. 2–11 and 13–18, name as in the table, do not tick “Use as digital input”); %s and %s are already on the page “APC-UPS NG” – drag them in a second time, do not create them anew. For %s, %s, %s and %s switch on “Statistics” in the properties window."
S2_SCHRITT4 = "Create four notifications (Periphery → Messages → Notification): “USV überlastet”, “USV zu warm”, “USV Akku lädt nicht”, “USV Netz unruhig”, texts as in the list. Each gets exactly one connection."
S2_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them according to the column “%s”. The formula #43 sits between #18 and the AND #32. Status inputs from V5 only appear after clicking the “+” on the block: “USV Akku” and “USV Netz und Last” four times (V5–V8), “USV Gerät” twice (V5/V6). The AND has two inputs. The rows of the status blocks are in the column “%s” and are entered by hand, the row without condition last. “Pulse at” stays at 00:00:00."
S2_SCHRITT6 = "Save and transfer. Test: “USV Gerät” shows model and shutdown thresholds; “USV Netz und Last” shows the same mains voltage as the plugin, tab “%s” → “%s”."
S2_H1 = "Choose the thresholds for your own UPS: overload 80/70 percent, too warm 40/35 °C, “Akku lädt nicht” 6 hours below 80 percent. If the UPS provides no temperature, -999 stands there – then the notification “zu warm” never triggers; a missing mains frequency shows as -1."
S2_H2 = "Statistics is a property of the input in the tree – it then also applies to %s on the page “APC-UPS NG”."
S2_H3 = "Battery age: from 48 months “USV Akku” shows that a replacement should be planned; there is deliberately no notification of its own. After replacing the battery set the installation date in the UPS anew (apcupsd program apctest), otherwise the age keeps counting."
S2_H4 = "“Umschaltungen heute” counts from midnight and shows -1 while the UPS makes no statement. After a restart of the Miniserver it stays at 0 until the next midnight; after a restart of apcupsd, apcupsd counts from zero."
S2_H5 = "Self-test and reason for the last transfer appear as apcupsd reports them (abbreviations, English) – the plugin does not translate them."
SCHRITT7 = "Step 7: verification"
SCHRITT7_TEXT = "Check <i>Incoming overview</i> in the MQTT gateway: the topics with the prefix must appear there as soon as the service has sent once. If they do not appear, the subscription from step 2 is missing — then everything further in Loxone is in vain. If they appear there but not in Loxone, the names of the virtual inputs do not match."
