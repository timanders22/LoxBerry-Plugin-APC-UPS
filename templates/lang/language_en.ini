ZWEITSCHRIFT_FEHLT = "Saved, but the second copy next to the configuration folder could not be updated – in an emergency an update would restore the older state."
SICH_TOKEN = "The file contains a speech token (%s) – it does not come from “Back up settings”."
SICH_WAHLFREI = "Not in the backup, left unchanged (new since 1.2.23): %s"

