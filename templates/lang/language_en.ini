DATA_VALID = "0 means COMMLOST: apcaccess then returns a complete looking data set, but the numbers in it are worthless."
ALARM_LEVEL = "0 on mains, 1 on battery, 2 advance warning, 3 apcupsd is shutting down. A dash (-) while the connection to the UPS is lost or apcaccess does not answer — a 0 would mean „all quiet“ there, and nobody knows that."
LOAD_WATT = "Calculated from load and rated power. Stays empty if the UPS reports no rated power."
BATTERY_AGE_MONTHS = "Calculated from the installation date. Stays empty if the date format is ambiguous — a wrong battery age would be worse than none."
STATUS_FLAG = "The raw status bit field from apcupsd, passed through unchanged. The meaning of the individual bits has not been verified on this installation; the status text remains authoritative."
TIMESTAMP = "Seconds since 1970 at the time of measurement. This lets Loxone distinguish whether a value is fresh or has been sitting in the broker for hours."
SERVICE_ONLINE = "The broker sets it to 0 itself when the connection breaks — even if the service crashes."
