AUSTAUSCH_FAELLIG = "replacement due"
ABSCHALTSCHWELLEN = "Shutdown thresholds of apcupsd"
SCHWELLEN_UNBEKANNT = "This UPS reports no thresholds — alarm_level therefore stays at 1 at most"
STUFE_0 = "on mains"
STUFE_1 = "on battery"
STUFE_2 = "advance warning"
STUFE_3 = "apcupsd is shutting down now"
NOTABSCHALTUNG = "Emergency shutdown"
NOTABSCHALTUNG_HILFE = "Whether and when the LoxBerry shuts down on an empty battery is decided by <b>apcupsd</b>, not by this plugin. The thresholds are in <span class='sm-mono'>/etc/apcupsd/apcupsd.conf</span> under <span class='sm-mono'>BATTERYLEVEL</span>, <span class='sm-mono'>MINUTES</span> and <span class='sm-mono'>TIMEOUT</span>. This is deliberately not pulled into this page: it is a system file managed by apcupsd, and two places with different thresholds would be worse than one. The values in force are shown in the table above."
