[LOXONE]
SCHRITT1 = "Step 1: choose the path"
SCHRITT1_TEXT = "<b>MQTT is the standard path.</b> The gateway creates the names of the virtual inputs itself; in Loxone a suitably named virtual input is enough. The old XML path remains for existing installations and is described below. First check in the <b>Test</b> tab with <i>Query now</i> whether the UPS answers at all — if values arrive there, the hard part is done."
SCHRITT2 = "Step 2: the subscription in the MQTT gateway"
SCHRITT2_TEXT = "The topic group of this plugin is:"
SCHRITT3 = "Step 3: create the virtual inputs"
SCHRITT3_TEXT = "The import file creates all inputs including title, unit and limits. Read it into Loxone Config via <i>Insert template</i>. Which topics exist and what they mean is listed in the MQTT tab."
KNOPF_MQTT = "Create template for the MQTT path"
KNOPF_XML = "Create template for the old XML path"
VORLAGE_ZAHL = "The MQTT template creates %d virtual inputs. The %d text topics are deliberately not included: the rebuilt template format is only proven for numeric values, and an analogue input on a text permanently shows 0. They are not lost — the MQTT gateway creates a suitable input itself on first receipt."
IMPORT_DOPPELT = "On import Loxone Config creates new objects and overwrites nothing. Importing twice means duplicate objects."
SCHRITT4 = "Step 4: sending commands"
SCHRITT4_TEXT = "This plugin does not switch anything on the UPS. There is therefore no virtual output and no template for one. The reason is not convenience: the monitoring service deliberately runs without root privileges, and a command to the UPS needs them. What the UPS does on an empty battery is decided by apcupsd — see the Settings tab, section Emergency shutdown."
SCHRITT5 = "Step 5: detecting a failure"
SCHRITT5_TEXT = "A virtual input keeps its last value when nothing arrives any more. In the app everything then looks normal although nothing has been measured for a long time. Three topics guard against this: <span class='sm-mono'>service/online</span> drops to 0 as soon as the service dies (the broker sets this itself, even on a crash); <span class='sm-mono'>data_valid</span> drops to 0 when apcupsd can no longer reach the UPS; and <span class='sm-mono'>timestamp</span> says when the last measurement was taken. A timeout watching timestamp should be set well above the configured query interval so that a single missed round does not trigger a message."
SCHRITT6 = "Step 6: complete list of blocks to rebuild 1:1"
BAUSTEINE_VORTEXT = "This is what the complete logic looks like on the programming page — every row is one block. All blocks can be found in Loxone Config via the block search (F5)."
