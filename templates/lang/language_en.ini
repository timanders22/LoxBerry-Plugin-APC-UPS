SP_BEDEUTUNG = "Meaning"
RETAIN_ERKLAERUNG = "<b>Retained means:</b> the broker remembers the last value and hands it to every new subscriber immediately. That is right for states — model, serial number, whether the UPS is on mains. For measurements it would be harmful: anyone reconnecting after an hour would be served an hour-old runtime and take it for current. Therefore only part of the topics is retained; the column above says which, for every single one. How fresh a value is, is told by <span class='sm-mono'>timestamp</span>."
RETAIN_KURZ = "Topics marked with R stay in the broker; the others arrive only when sent. How fresh a value is, is told by the timestamp topic."
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> without this entry nothing arrives at the Miniserver; the line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."

[LOXONE]
SCHRITT1 = "Step 1: choose the path"
SCHRITT1_TEXT = "<b>MQTT is the standard path.</b> The gateway creates the names of the virtual inputs itself; in Loxone a suitably named virtual input is enough. The old XML path remains for existing installations and is described below. First check in the <b>Test</b> tab with <i>Query now</i> whether the UPS answers at all — if values arrive there, the hard part is done."
SCHRITT2 = "Step 2: the subscription in the MQTT gateway"
SCHRITT2_TEXT = "The topic group of this plugin is:"
SCHRITT3 = "Step 3: create the virtual inputs"
SCHRITT3_TEXT = "The import file creates all inputs including title, unit and limits. Read it into Loxone Config via <i>Insert template</i>. Which topics exist and what they mean is listed in the MQTT tab."
KNOPF_MQTT = "Create template for the MQTT path"
KNOPF_XML = "Create template for the old XML path"
VORLAGE_ZAHL = "The MQTT template creates %d virtual inputs. The %d text topics are deliberately not included: the rebuilt template format is only proven for numeric values, and an analogue input on a text permanently shows 0. Whoever needs them in Loxone creates them by hand as a virtual text input, title = prefix_topic (e.g. %s)."
IMPORT_DOPPELT = "On import Loxone Config creates new objects and overwrites nothing. Importing twice means duplicate objects."
SCHRITT4 = "Step 4: sending commands"
SCHRITT4_TEXT = "This plugin does not switch anything on the UPS. There is therefore no virtual output and no template for one. The reason is not convenience: the monitoring service deliberately runs without root privileges, and a command to the UPS needs them. What the UPS does on an empty battery is decided by apcupsd — see the Settings tab, section Emergency shutdown."
SCHRITT5 = "Step 5: detecting a failure"
SCHRITT5_TEXT = "A virtual input keeps its last value when nothing arrives any more. In the app everything then looks normal although nothing has been measured for a long time. Three topics guard against this: <span class='sm-mono'>service/online</span> drops to 0 as soon as the service dies (the broker sets this itself, even on a crash); <span class='sm-mono'>data_valid</span> drops to 0 when apcupsd can no longer reach the UPS; and <span class='sm-mono'>timestamp</span> says when the last measurement was taken. A timeout watching timestamp should be set well above the configured query interval so that a single missed round does not trigger a message."
SCHRITT6 = "Step 6: two complete block lists to rebuild"
BAUSTEINE_VORTEXT = "Two pages from the LoxBerry plugins sample project, every row one block (block search in Loxone Config: key <b>F5</b>). The first shows power failure, advance warning and shutdown, reports faults of the query and sheds loads when the battery runs low – it is enough to start with. The second shows battery, mains, load and device data and reports overload, heat, a battery that does not charge and an unsteady mains. The inputs come from the template for the MQTT path (step 3), the text inputs are created by hand; the MQTT gateway assigns the names – keep them as they are."
