ROHFELDER = "Additional raw fields from apcaccess"
ROHFELDER_HILFE = "Comma separated field names, spelled exactly as in the output of apcaccess. They are published unchanged under <span class='sm-mono'>&lt;prefix&gt;/raw/&lt;FIELD&gt;</span>. This lets you fetch values that only certain models provide, without waiting for a new version of the plugin. Empty by default. If it contains anything that is not a field name, or a name twice, nothing is saved. Lower case is turned into capitals; comma, semicolon and space all work as separators."
