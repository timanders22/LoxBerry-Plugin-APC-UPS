ZU_10 = "The notification block only sends on a change from off to on. Never connect several sources directly to its input — a permanently active source would swallow all the others. Combine them with an OR block first."
ZU_8 = "The on delay absorbs short mains dips. Without it the house reports every two-second voltage drop."
ZU_12 = "This is where the actual benefit sits: from level 2 there are still the configured advance warning time and percentage points left before apcupsd shuts down. In that time the Miniserver can shed loads in stages — comfort first, then side rooms, finally everything except the heating control."
ZU_6 = "Loxone counts seconds since 1 January 2009, this topic counts seconds since 1970. To compare the two, subtract 1230768000."
SCHRITT7 = "Step 7: verification"
SCHRITT7_TEXT = "Check <i>Incoming overview</i> in the MQTT gateway: the topics with the prefix must appear there as soon as the service has sent once. If they do not appear, the subscription from step 2 is missing — then everything further in Loxone is in vain. If they appear there but not in Loxone, the names of the virtual inputs do not match."
ALTER_WEG = "The old XML path remains available"
ALTER_WEG_TEXT = "The original version provided an XML page at this address which Loxone fetches itself. It stays unchanged so that existing installations keep working. Since 1.2.0 it also honours the setting <i>UPS on another machine</i> and, in addition to the raw fields, provides the derived values in a <span class='sm-mono'>CALC</span> block — the same ones sent over MQTT, together with their age in seconds."
