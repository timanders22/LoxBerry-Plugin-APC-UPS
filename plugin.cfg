[AUTHOR]
# ACHTUNG - hier stand bis 1.0.0 die Urheberschaft des Originalplugins
# (Christian Woerstenfeld). Das war aus zwei Gruenden falsch:
#
# 1. LoxBerry benutzt NAME und EMAIL als KENNUNG des Plugins, nicht als
#    Urhebervermerk. Diese Fortfuehrung trug damit die Kennung eines fremden
#    Plugins, zeigte mit AUTOMATIC_UPDATES aber auf ein anderes Repository.
#    Wer das Original installiert hatte, bekam eine Mischform, die LoxBerry
#    nicht sauber aufloesen kann.
# 2. Fehlerberichte und Rueckfragen waeren beim Originalautor gelandet, der
#    mit dieser Fassung nichts zu tun hat.
#
# Die von der Apache-Lizenz 2.0 verlangte Nennung steht dort, wo sie
# hingehoert: in NOTICE (samt Liste der Aenderungen nach Abschnitt 4 b), in
# README.md, in der Hilfeseite und im Kopf beider Python-Dateien.
#
# FOLGE DER UMSTELLUNG: LoxBerry sieht diese Fassung als NEUES Plugin. Wer
# 1.0.0 installiert hat, bekommt 1.1.0 nicht ueber das Auto-Update, sondern
# muss einmalig von Hand installieren. Danach laeuft es wieder von selbst.
NAME=APC-UPS NG LoxBerry Plugin Authors
EMAIL=apc-ups-loxberry@users.noreply.github.com

[PLUGIN]
# In der Originalfassung stand hier VERSION=2021.05.14, obwohl der letzte Tag
# 2022.01.29 hiess - die Datei wurde beim Release nicht mitgezogen.
VERSION=1.1.5
# Ohne Leerzeichen und klein - LoxBerry filtert Leerzeichen sonst heraus, und
# aus NAME werden Skript- und Dienstnamen gebildet. Der Anzeigename steht in
# TITLE.
NAME=apc_ups_ng
FOLDER=apc_ups_ng
TITLE=APC-UPS NG

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Ohne Architekturbindung: apcupsd und Python 3 laufen auf beiden.
ARCHITECTURE=
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
# Beide URLs zeigen auf diese Fortfuehrung, nicht auf das Original. Zeigten
# sie auf die Originalquelle, holte LoxBerry beim naechsten Update-Lauf die
# alte Fassung und ueberschriebe den Umbau.
AUTOMATIC_UPDATES=true

RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-APC-UPS/master/release.cfg

PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-APC-UPS/master/prerelease.cfg
